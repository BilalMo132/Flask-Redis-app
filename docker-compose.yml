services:
  web:
    build: .
    ports:
      - "5000"
    depends_on:
      - redis_host
    environment:
      - REDIS_HOST=redis_host
      - REDIS_PORT=6379
  redis_host:
     image: "redis:latest"
     volumes:
     - redis-data:/data
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    ports:
      - 80:80

volumes:
   redis-data:
      driver: local
  